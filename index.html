<header><div class="top"><div class="brand">Bardach · Steps 5 and 6 · Basic v3</div><div class="case-title" id="title"></div><nav aria-label="Bardach steps in this exercise"><button type="button" data-go="1">1–4 · Recall</button><button type="button" data-go="2">5 · Project</button><button type="button" data-go="3">6 · Compare</button></nav></div></header>
<div id="storage-notice" class="hint" role="status" hidden></div><main><section id="case-step" tabindex="-1"></section></main>
<footer>Classroom estimates, not empirical forecasts. Your three explanations stay in this browser on this device. This file works offline. <button type="button" class="quiet" id="reset">Restart this case</button></footer>
<script>
'use strict';
const C={"id":"szewczyk","student":"Zuzanna Szewczyk","surname":"Szewczyk","title":"Staff engagement in social assistance","source":"paper","client":"Minister of Family, Labour and Social Policy","decision":"Choose a 2027 programme to improve contact with social-assistance users.","problem":"Too many people who use social assistance in Poland think that its staff do not engage enough with their problems.","period":"Users’ assessments at the end of 2027","base":"Centres continue their current practice, without either new programme.","options":[{"id":"C","name":"Administrative support","action":"Fund administrative help so social workers have more time with users."},{"id":"B","name":"Communication training","action":"Fund workshops on difficult conversations with users."}],"cols":[{"id":"k0","sourceKey":"c1","label":"Negative ratings of staff engagement","unit":"% of users","deltaUnit":"percentage points","dir":"min","min":0,"max":100},{"id":"k1","sourceKey":"c2","label":"Ministry programme cost","unit":"PLN million","deltaUnit":"PLN million","dir":"min","min":0,"max":null}],"scenarios":[{"name":"First assumption","assumption":"Assume both communication skills and meeting time affect negative ratings.","rows":{"base":{"k0":17,"k1":0},"C":{"k0":11,"k1":60},"B":{"k0":13,"k1":15}}},{"name":"Changed assumption","assumption":"Assume lack of meeting time is the main bottleneck. Training alone does not release time.","rows":{"base":{"k0":17,"k1":0},"C":{"k0":11,"k1":60},"B":{"k0":17,"k1":15}}}],"change":{"row":"B","col":"k0","reason":"Training no longer improves the rating relative to the future base. B’s projected negative ratings rise from 13% to 17%."},"mechanism":"Administrative help releases time for conversations. This improves ratings only if centres use that time with users.","scope":"Time per meeting and unequal reach across centres also matter. Ratings are an outcome; attendance at training is an activity.","condition":"Assume municipalities agree to both voluntary programmes."};
const KEY='s4-basic-v3:'+C.id;
const X=C.options[0].id,Y=C.options[1].id;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=n=>new Intl.NumberFormat('en-GB',{maximumFractionDigits:3}).format(n);
const name=id=>id==='base'?'Future base':id+' · '+C.options.find(o=>o.id===id).name;
const gain=(a,b,col)=>col.kind==='ord'?Math.sign(col.levels.indexOf(a)-col.levels.indexOf(b))*(col.dir==='max'?1:-1):(a-b)*(col.dir==='max'?1:-1);
const valueText=(v,col)=>col.kind==='ord'?col.labels[v]:fmt(v);
const p0=C.scenarios[0].rows,p1=C.scenarios[1].rows;
const glossaryOpen=new Set();
const defaults=()=>({version:3,step:1,brief:'',issue:'',baseAnswer:null,forecast:'',class1:'',trade:'',prediction:'',revealed:false,class2:'',change:'',finished:false,...(C.revision?{revision:C.revision}:{})});
let S=defaults(),storageMessage='',previousWork=null,protectPrevious=false;
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v.version!==3||typeof v!=='object')throw Error('version');if(C.revision&&v.revision!==C.revision){previousWork=v;try{if(!localStorage.getItem(KEY+':before-'+C.revision))localStorage.setItem(KEY+':before-'+C.revision,raw);}catch(e){protectPrevious=true;}storageMessage='This exercise now follows your paper and uses different criteria. Start a new comparison; your earlier answers are kept separately.';}else for(const k of Object.keys(S))if(typeof v[k]===typeof S[k]||k==='baseAnswer'&&(typeof v[k]==='number'||v[k]===null))S[k]=v[k];}if(C.revision&&!previousWork){const archived=localStorage.getItem(KEY+':before-'+C.revision);if(archived){previousWork=JSON.parse(archived);storageMessage='Earlier answers used the previous brief and are kept separately. You can download them below.';}}}catch(e){storageMessage='Saved work could not be read. You can work here and download your note before closing.';}
const sentence=v=>(String(v).match(/[\p{L}\p{N}]+/gu)||[]).length>=4;
const baseGain=gain(p0[Y].k0,p0.base.k0,C.cols[0]);
function classification(rows){const gs=C.cols.map(c=>gain(rows[X][c.id],rows[Y][c.id],c));if(gs.every(x=>x===0))return 'same';if(gs.every(x=>x>=0))return 'x';if(gs.every(x=>x<=0))return 'y';return 'trade';}
function baseReady(){return ['recognised','provisional'].includes(S.brief)&&(S.brief!=='provisional'||['client','problem','options','measure'].includes(S.issue));}
function projectReady(){return baseReady()&&S.baseAnswer===baseGain&&sentence(S.forecast);}
function firstReady(){return projectReady()&&S.class1===classification(p0)&&sentence(S.trade);}
function completeReady(){return firstReady()&&S.revealed&&['improve','worsen','same','known'].includes(S.prediction)&&S.class2===classification(p1)&&sentence(S.change);}
if(!baseReady())S.step=1;else if(!projectReady()&&S.step===3)S.step=2;
if(![1,2,3].includes(S.step))S.step=1;
if(!firstReady())S.finished=false;
if(!completeReady())S.finished=false;
function save(){try{if(protectPrevious)throw Error('previous work not archived');localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageMessage='Browser saving is unavailable. Keep this page open and download your note before closing.';}showStorage();}
function showStorage(){const el=$('#storage-notice');el.hidden=!storageMessage;el.innerHTML=esc(storageMessage)+(previousWork?' <button type="button" class="quiet" data-act="download-previous">Download earlier answers</button>':'');}
function choices(field,items,legend){return '<fieldset><legend>'+esc(legend)+'</legend>'+items.map(([v,t])=>'<label class="choice"><input type="radio" name="'+field+'" data-field="'+field+'" value="'+esc(v)+'"'+(String(S[field])===String(v)?' checked':'')+'><span>'+esc(t)+'</span></label>').join('')+'</fieldset>';}
function textField(field,label,help){return '<label class="field" for="'+field+'">'+esc(label)+'<small>'+esc(help)+'</small><textarea id="'+field+'" data-field="'+field+'" maxlength="500" placeholder="Write one short sentence.">'+esc(S[field])+'</textarea></label>';}
function status(ok,text){return '<div class="feedback '+(ok?'good':'warn')+'" role="status">'+esc(text)+'</div>';}
function scope(){return '<p class="scope"><strong>What else matters:</strong> '+esc(C.scope)+'</p>';}
function table(rows,base=true){return '<table><caption>Illustrative outcomes · '+(base?'first assumption':'changed assumption')+'</caption><thead><tr><th scope="col">Option</th>'+C.cols.map(c=>'<th scope="col">'+esc(c.label)+'<small>'+esc(c.unit)+'<br>'+esc(c.directionLabel||(c.dir==='min'?'Lower':'Higher')+' is better')+'</small></th>').join('')+'</tr></thead><tbody>'+(base?['base',X,Y]:[X,Y]).map(id=>'<tr><th scope="row">'+esc(name(id))+'</th>'+C.cols.map(c=>{const changed=rows[id][c.id]!==p0[id][c.id];return '<td'+(changed?' class="cell-changed"':'')+'><span class="'+(c.kind==='ord'?'qual':'num')+'">'+esc(valueText(rows[id][c.id],c))+'</span>'+(changed?'<span class="was">was '+esc(valueText(p0[id][c.id],c))+'</span>':'')+'</td>';}).join('')+'</tr>').join('')+'</tbody></table>';}
function pairFacts(rows){return '<ul class="facts">'+C.cols.map(c=>{const g=gain(rows[X][c.id],rows[Y][c.id],c);return '<li><strong>'+esc(c.label)+':</strong> '+esc(X)+' = '+esc(valueText(rows[X][c.id],c))+', '+esc(Y)+' = '+esc(valueText(rows[Y][c.id],c))+'. '+(g===0?'The outcomes are equal.':c.kind==='ord'?esc(X)+' is '+(g>0?'more':'less')+' favourable on this criterion; no numerical distance is assigned.':esc(X)+' is '+(g>0?'better':'worse')+' by <strong>'+fmt(Math.abs(g))+' '+esc(c.deltaUnit)+'</strong>.')+'</li>';}).join('')+'</ul>';}
function baseCheck(rows){const beat=[X,Y].filter(id=>{const gs=C.cols.map(c=>gain(rows.base[c.id],rows[id][c.id],c));return gs.every(g=>g>=0)&&gs.some(g=>g>0);});return beat.length?'The future base also beats '+beat.join(' and ')+' on the two shown criteria: it is at least as good on both and better on at least one. Keep “no new programme” in the decision too.':'';}
function baseHTML(rows){const text=baseCheck(rows);return text?'<p class="hint"><strong>Check the future base:</strong> '+esc(text)+'</p>':'';}
function classItems(){return [['trade','Each option has a different advantage'],['x','Only '+X+' has an advantage here'],['y','Only '+Y+' has an advantage here'],['same','Neither differs on these criteria']];}
function classExplanation(rows){const type=classification(rows);if(type==='trade')return 'There is a trade-off: choosing either option gives up an advantage of the other. The client must judge how much each outcome matters.';if(type==='same')return 'These two criteria do not separate the options. Check other outcomes or evidence.';const winner=type==='x'?X:Y,loser=type==='x'?Y:X;return winner+' is at least as good on both shown criteria and better on at least one. '+loser+' has no advantage in this small comparison. Check the other issues before a full recommendation.';}
function classFeedback(field,rows){return S[field]?status(S[field]===classification(rows),(S[field]===classification(rows)?'Yes. ':'Try again. ')+classExplanation(rows)):'';}
const changeCol=C.cols.find(c=>c.id===C.change.col);
const changeGain=gain(p1[C.change.row][changeCol.id],p0[C.change.row][changeCol.id],changeCol);
const actualPrediction=changeGain>0?'improve':changeGain<0?'worsen':'same';
const predictionName={improve:'improve',worsen:'worsen',same:'stay the same',known:'used a value I already knew for this HTML scenario'};
function helpTerm(step,key,title,definition,example){const id='g'+step+'-'+key;return '<details id="'+id+'"'+(glossaryOpen.has(id)?' open':'')+'><summary>'+esc(title)+'</summary><p>'+esc(definition)+'</p><p class="example"><strong>In your case:</strong> '+esc(example)+'</p></details>';}
function glossary(step){
 const col=C.cols[0],v=p0[X].k0,b=p0.base.k0,g=gain(v,b,col),firstDiff=gain(p0[X].k0,p0[Y].k0,col);
 let terms='';
 if(step===5){
  terms+=helpTerm(5,'outcome','Alternative and outcome','An alternative is an action you could take. An outcome is what that action is projected to produce. A programme’s name or intention does not establish its effect.',name(X)+' is an action option. '+col.label+' = '+fmt(v)+' '+col.unit+' is one projected outcome.');
  let units=col.deltaUnit==='percentage points'?' A percentage point is an absolute difference between percentages, not a percentage change.':'';
  terms+=helpTerm(5,'criterion','Criterion, direction and unit','A criterion says what counts as a better outcome. Keep its measure, population and time definition consistent across rows.'+units,col.label+': '+(col.dir==='min'?'lower':'higher')+' is better; the unit is '+col.unit+'. '+C.cols[1].label+(C.cols[1].kind==='ord'?' uses named categories, not a numerical score.':' uses '+C.cols[1].unit+'.'));
  terms+=helpTerm(5,'base','Future base and increment','The future base is what you project without the new action. An increment is the difference made relative to that base. Today’s observation and the future base can differ.',name(X)+' projects '+fmt(v)+' against a future base of '+fmt(b)+': '+fmt(Math.abs(g))+' '+col.deltaUnit+' '+(g>=0?'improvement.':'deterioration.'));
  terms+=helpTerm(5,'projection','Projection, causal assumption and uncertainty','A projection combines a causal explanation with evidence to estimate what may happen. A precise-looking number is not certainty. Here the numbers are supplied teaching assumptions; you explain their logic rather than estimate an empirical effect.',C.mechanism);
  terms+=helpTerm(5,'matrix','Outcomes matrix','Rows contain alternatives, columns contain criteria, and each cell contains a projected outcome. Bardach uses the matrix to prepare the comparison of gains and sacrifices.','Your rows are the future base, '+X+' and '+Y+'. Only two criteria are selected; this is a small part of the full case.');
 }else{
  terms+=helpTerm(6,'tradeoff','Trade-off: a gain and a sacrifice','A trade-off exists when gaining on one criterion requires giving up something on another. Compare projected outcomes, not just programme labels. Money is only one possible sacrifice.','Describe '+name(X)+' versus '+name(Y)+' using both '+C.cols[0].label+' and '+C.cols[1].label+'.');
  terms+=helpTerm(6,'increment','Incremental comparison','In step 5 you compare an option with the future base. In step 6 you also subtract one option’s projected outcomes from another’s to identify the extra gain and sacrifice. Keep the units.'+(C.cols.some(c=>c.kind==='ord')?' Describe qualitative differences in words; do not subtract the categories.':''),'On '+col.label+', '+X+' = '+fmt(p0[X].k0)+' and '+Y+' = '+fmt(p0[Y].k0)+': '+(firstDiff===0?'no difference.':X+' is '+(firstDiff>0?'better':'worse')+' by '+fmt(Math.abs(firstDiff))+' '+col.deltaUnit+'.'));
  terms+=helpTerm(6,'dominance','Dominance, and the limits of this screen','One option dominates another if it is no worse on every criterion considered and better on at least one. Then the worse option offers no compensating gain on those criteria. Two selected criteria do not establish dominance over the full case.','Test both columns for '+X+' and '+Y+'. Also read “What else matters” before making a full recommendation.');
  terms+=helpTerm(6,'weights','Client’s values and weights','Weights express how much the client values one outcome relative to another. Different forecasts can change a trade-off even when those values stay fixed. We do not assign numerical weights here.',C.client+' would have to judge '+C.cols[0].label+' against '+C.cols[1].label+'. The app does not make that value judgement.');
  const changeExample=S.revealed?C.change.row+' on '+changeCol.label+': '+fmt(p0[C.change.row][changeCol.id])+' → '+fmt(p1[C.change.row][changeCol.id])+' '+changeCol.unit+'. All other numbers stay fixed.':'You will change one forecast for '+C.change.row+' on '+changeCol.label+'. Predict its direction before revealing the number.';
  terms+=helpTerm(6,'sensitivity','Sensitivity to an assumption · return to step 5','Ask whether a different plausible projection changes the comparison. Here you revisit step 5 with one changed assumption, then return to step 6. This is a small sensitivity exercise, not a systematic analysis of all uncertainties.',changeExample);
 }
 const scopeId='g'+step+'-scope';
 const used=step===5?['Separate an action from its projected result.','State a causal assumption and a rough magnitude; compare with the future base.','Use a small outcomes matrix with clear directions and units.']:['Focus on outcomes and incremental gains and sacrifices.','Check for a trade-off or dominance on the shown criteria, including the future base when relevant.','Keep the client’s values distinct from changes in forecasts.'];
 const omitted=step===5?'We do not collect evidence, validate effects, estimate ranges or probabilities, or project every relevant outcome for every option. These are parts of the fuller step 5.':'We do not calculate cost per extra unit, set numerical weights or assess every criterion and uncertainty. Choosing a final recommendation (step 7) and presenting the full analysis (step 8) remain beyond this exercise.';
 return '<section class="glossary" id="glossary-'+step+'" aria-labelledby="glossary-title-'+step+'"><h2 id="glossary-title-'+step+'">Step '+step+' · glossary for this task</h2><p>Open a term when you need it. The examples use your own case.</p>'+terms+'<details id="'+scopeId+'"'+(glossaryOpen.has(scopeId)?' open':'')+'><summary>Which Bardach guidelines do we practise here?</summary><p><strong>Practised here:</strong></p><ul>'+used.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><p><strong>Beyond this example:</strong> '+esc(omitted)+'</p></details><p class="source">Based on Bardach &amp; Patashnik, <em>A Practical Guide for Policy Analysis</em>, Steps Five and Six (course reading). Explanations are paraphrases.</p></section>';
}
function render(){
 document.querySelectorAll('.glossary details, #case-limits').forEach(el=>{if(el.open)glossaryOpen.add(el.id);else glossaryOpen.delete(el.id);});
 const active=document.activeElement;
 const focus=active?.dataset?.field?{field:active.dataset.field,value:active.value,type:active.type,start:active.selectionStart,end:active.selectionEnd}:null;
 $('#title').textContent=C.title;
 document.querySelectorAll('nav button').forEach(b=>{const n=Number(b.dataset.go);b.disabled=n===2&&!baseReady()||n===3&&!projectReady();if(n===S.step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
 let h='';
 if(S.step===1){
  h='<p class="eyebrow">Before task 1 · recall Bardach steps 1–4</p><h1>Your familiar case</h1><p>Use this small comparison to learn projection and trade-offs. Keep the same definitions across options.</p><p class="bardach-guide"><strong>Your place in Bardach’s approach:</strong> recall the problem (1), evidence (2), alternatives (3) and criteria (4). Next, project outcomes (5) and confront trade-offs (6). You are practising a small part of the full analysis.</p>';
  if(C.source.startsWith('form'))h+='<div class="changed"><strong>Provisional brief.</strong> This is based on your form; no reflection paper was available. Use it for the exercise, then confirm the brief with your lecturer.</div>';
  h+='<p class="hint">Reuse valid saved answers for classroom tasks 1–2. The new classroom task 3 is on your card; this HTML keeps its earlier scenario.</p>';
  h+='<div class="card"><dl><dt>Client and decision</dt><dd>'+esc(C.client)+': '+esc(C.decision)+'</dd><dt>Problem</dt><dd>'+esc(C.problem)+'</dd><dt>When and for whom</dt><dd>'+esc(C.period)+'</dd><dt>Future base · without either new option</dt><dd>'+esc(C.base)+'</dd></dl></div><div class="options">'+C.options.map(o=>'<div class="card"><h3>'+esc(o.id+' · '+o.name)+'</h3><p>'+esc(o.action)+'</p></div>').join('')+'</div>';
  h+='<details id="case-limits"'+(glossaryOpen.has('case-limits')?' open':'')+'><summary>Case limits and source · open if needed</summary>'+(C.paperSource?'<p class="muted">Brief source: '+esc(C.paperSource)+'</p>':'')+'<p class="scope"><strong>Conditions kept:</strong> '+esc(C.condition)+'</p>'+scope()+'</details>';
  if(C.paperPreference)h+='<div class="hint">'+esc(C.paperPreference)+'</div>';
  if(C.firstCheck)h+='<div class="hint">'+esc(C.firstCheck)+'<p>For today’s exercise, use the supplied base. Verify this before giving real advice.</p></div>';
  h+='<div class="hint"><strong>Two criteria for this exercise:</strong> '+C.cols.map(c=>esc(c.label)+' ('+esc(c.unit)+'; '+esc(c.directionLabel||(c.dir==='min'?'lower':'higher')+' is better')+')').join(' · ')+'. <br>All numbers below are classroom assumptions, not measured effects.</div>';
  h+=choices('brief',[['recognised','I recognise this brief and can use it'],['provisional','I will use it provisionally; one element needs checking']],'Does this match your work so far?');
  if(S.brief==='provisional')h+=choices('issue',[['client','Client or decision'],['problem','Problem'],['options','Options'],['measure','Outcome or measurement']],'Which element needs checking later?');
  h+='<div class="row-actions"><button type="button" class="btn primary" data-act="next-project"'+(!baseReady()?' disabled':'')+'>Project the outcomes →</button></div>';
 }else if(S.step===2){
  const col=C.cols[0],v=p0[X].k0,b=p0.base.k0,g=gain(v,b,col),eq=col.dir==='min'?fmt(b)+' − '+fmt(v):fmt(v)+' − '+fmt(b);
  h='<p class="eyebrow">Task 1 · Bardach step 5</p><h1>What is likely to happen?</h1><p class="bardach-guide"><strong>Step 5 · Project the outcomes.</strong> Ask what each action would produce, why, and by how much compared with the future base. You practise this reasoning with supplied estimates.<br><a href="#g5-base" data-help="g5-base">Help with the future base and other terms ↓</a></p><div class="hint"><strong>First assumption:</strong> '+esc(C.scenarios[0].assumption)+'</div>'+table(p0);
  h+='<div class="card"><h2>A worked projection: '+esc(X)+'</h2><p>'+esc(C.mechanism)+'</p><p><strong>'+esc(col.label)+':</strong> the future base is '+fmt(b)+'; '+esc(X)+' projects '+fmt(v)+'. '+esc(eq)+' = '+fmt(g)+' '+esc(col.deltaUnit)+' '+(g>=0?'improvement':'(a deterioration)')+'.</p><p class="muted">The base is a projection without the new programme, not automatically today’s value. The option’s name does not prove its effect.</p></div>';
  const gains=[baseGain,p0[Y].k0,-baseGain,0,baseGain+1].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);gains.sort((a,b)=>a-b);
  h+=choices('baseAnswer',gains.map(v=>[v,v===0?'No change':(v>0?'Improves':'Worsens')+' by '+fmt(Math.abs(v))+' '+col.deltaUnit]),'Your turn: how does '+Y+' compare with the future base on '+col.label+'?');
  if(S.baseAnswer!==null){const eqY=col.dir==='min'?fmt(b)+' − '+fmt(p0[Y].k0):fmt(p0[Y].k0)+' − '+fmt(b);h+=status(S.baseAnswer===baseGain,(S.baseAnswer===baseGain?'Yes. ':'Check the base, not the other option. ')+eqY+' = '+fmt(baseGain)+' '+col.deltaUnit+' '+(baseGain===0?'change.':baseGain>0?'improvement.':'(a deterioration).'));}
  h+=textField('forecast','1 · Project — Step 5','Use '+Y+' versus the future base in the first outcome column. Give the difference in '+col.deltaUnit+', say higher/lower/no change, and state one assumption.');
  h+='<p class="muted">A classroom number lets us practise reasoning. An empirical forecast would also need evidence.</p><div class="row-actions"><button type="button" class="btn primary" id="to-compare" data-act="next-compare"'+(!projectReady()?' disabled':'')+'>Compare the outcomes →</button><span id="project-status" role="status"></span></div>';
  h+=glossary(5);
 }else{
  h='<p class="eyebrow">Tasks 2 and 3 · compare, then revise</p><h1>What do we gain and give up?</h1><p class="bardach-guide"><strong>Step 6 · Confront the trade-offs.</strong> Identify the extra gain and sacrifice in the projected outcomes. The client judges their relative importance.<br><a href="#g6-tradeoff" data-help="g6-tradeoff">Help with trade-offs and other terms ↓</a></p><p>Compare <strong>'+esc(name(X))+'</strong> with <strong>'+esc(name(Y))+'</strong>.</p><div class="card"><h2>Under the first assumption</h2>'+pairFacts(p0)+choices('class1',classItems(),'On these two criteria, which description fits?')+classFeedback('class1',p0)+baseHTML(p0)+'</div>';
  h+=textField('trade','2 · Compare — Step 6','Compare '+X+' with '+Y+' using both criteria. State the gain and sacrifice, with units or category labels.');
  h+='<div class="rule"><h2>Return to step 5 · change one assumption</h2><p class="hint"><strong>Earlier HTML scenario.</strong> The new classroom task 3 uses a different assumption and value on your card. Work that new variant on the card.</p><p class="step-return">Bardach’s steps can be revisited: revise a projection, then check its trade-offs again.</p><div class="hint">'+esc(C.scenarios[1].assumption)+'<p>Only one projected outcome changes. The future base and all other numbers stay fixed.</p></div>';
  if(!firstReady())h+='<p id="change-locked" role="status">First check the comparison above and write your sentence to unlock the prediction.</p>';
  else if(!S.revealed){h+=choices('prediction',[['improve','Improve'],['worsen','Worsen'],['same','Stay the same']],'Predict: relative to the first assumption, what happens to '+C.change.row+' on '+changeCol.label+'?')+'<button type="button" class="btn primary" data-act="reveal"'+(!S.prediction?' disabled':'')+'>Reveal and compare with my prediction</button><button type="button" class="quiet" data-act="use-card-value">I already know this HTML scenario’s value · show it</button>';}
  else{
   const before=p0[C.change.row][changeCol.id],after=p1[C.change.row][changeCol.id];
   h+='<div class="changed" id="change-result" role="status"><strong>'+esc(C.change.row+' · '+changeCol.label)+': '+fmt(before)+' → '+fmt(after)+' '+esc(changeCol.unit)+'</strong><p>'+(S.prediction==='known'?'You used a value you already knew for this HTML scenario.':'You predicted: '+esc(predictionName[S.prediction])+'.')+' In this classroom model: '+esc(predictionName[actualPrediction])+'.</p><p>'+esc(C.change.reason)+'</p></div><div class="card"><h2>Back to step 6 · compare again</h2>'+pairFacts(p1)+choices('class2',classItems(),'What describes the new two-criterion comparison?')+classFeedback('class2',p1)+baseHTML(p1)+'</div>';
   h+=textField('change','3 · Earlier HTML comparison — Steps 5 → 6','Use the new value to compare '+X+' with '+Y+' again on both criteria. Explain what changed and why. The client’s priorities did not change automatically.');
  }
  h+='</div>'+scope()+'<div class="row-actions"><button type="button" class="btn primary" id="finish" data-act="finish"'+(!completeReady()?' disabled':'')+'>Keep my three explanations</button><span id="status" role="status"></span></div>';
  h+='<div id="result"'+(!S.finished?' hidden':'')+'><div class="card"><h2>Your learning note</h2><p>Check your reasoning with a partner or lecturer. These answers record your thinking; the app does not grade the quality of your explanations.</p><label class="field" for="learning-note">Three explanations and their assumptions<textarea id="learning-note" readonly>'+esc(note())+'</textarea></label><div class="row-actions"><button type="button" class="btn" data-act="copy">Copy note</button><button type="button" class="btn" data-act="download">Download TXT</button><span id="copy-status" role="status"></span></div></div></div>';
  h+=glossary(6);
 }
 $('#case-step').innerHTML=h;showStorage();update();
 if(focus){const target=[...document.querySelectorAll('[data-field]')].find(el=>el.dataset.field===focus.field&&(focus.type!=='radio'||el.value===focus.value));if(target){target.focus({preventScroll:true});if(target.tagName==='TEXTAREA')target.setSelectionRange(focus.start,focus.end);}}
}
function note(){return [C.student+' · '+C.title,'Bardach steps 5–6 · Basic v3','Brief: '+(S.brief==='provisional'?'provisional; check '+S.issue:'recognised')+'.','Scope: two selected criteria; not a full recommendation.',...(C.firstCheck?['Before projecting: '+C.firstCheck]:[]),C.cols.map(c=>c.label+' ['+c.unit+']').join(' | '),'First assumption: '+C.scenarios[0].assumption,...['base',X,Y].map(id=>name(id)+': '+C.cols.map(c=>valueText(p0[id][c.id],c)).join(' | ')), '1. My forecast: '+S.forecast,'2. My first comparison: '+S.trade,'Changed assumption: '+C.scenarios[1].assumption,C.change.row+': '+fmt(p0[C.change.row][C.change.col])+' → '+fmt(p1[C.change.row][C.change.col])+' '+changeCol.unit+'. All other numbers stay fixed.','Prediction or card value: '+predictionName[S.prediction]+'. Model result: '+predictionName[actualPrediction]+'.','3. My explanation of the change: '+S.change,'Other issues: '+C.scope,'Conditions: '+C.condition,'Provenance: every numerical value is an illustrative classroom assumption.'].join('\n\n');}
function update(){
 const to=$('#to-compare');if(to)to.disabled=!projectReady();
 const ps=$('#project-status');if(ps)ps.textContent=projectReady()?'Ready.':S.baseAnswer!==baseGain?'Check the comparison with the future base.':'Add a short forecast sentence with an assumption.';
 const finish=$('#finish');if(finish)finish.disabled=!completeReady();
 const st=$('#status');if(st)st.textContent=completeReady()?'Your three explanations are ready to discuss.':'Check both comparisons and complete the three short explanations.';
 const res=$('#result');if(res)res.hidden=!S.finished;
}
function go(n){if(n===2&&!baseReady()||n===3&&!projectReady())return;S.step=n;save();render();$('#case-step').focus();window.scrollTo(0,0);}
document.addEventListener('input',e=>{
 const f=e.target.dataset.field;if(!f||e.target.type==='radio')return;
 const wasReady=firstReady();S[f]=e.target.value;S.finished=false;
 // Preserve later writing while earlier explanations are revised. Completion is
 // recalculated, and the changed comparison stays gated until the first is ready.
 save();
 if(S.step===3&&f==='trade'&&wasReady!==firstReady())render();else update();
});
document.addEventListener('change',e=>{
 const f=e.target.dataset.field;if(!f||e.target.type!=='radio')return;
 S[f]=f==='baseAnswer'?Number(e.target.value):e.target.value;S.finished=false;
 save();render();
});
document.addEventListener('click',async e=>{
 const help=e.target.closest('a[data-help]');if(help){const target=document.getElementById(help.dataset.help);if(target){e.preventDefault();target.open=true;target.scrollIntoView({block:'start'});target.querySelector('summary').focus({preventScroll:true});}return;}
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.go)return go(Number(b.dataset.go));
 const a=b.dataset.act;
 if(a==='use-card-value'&&firstReady()){S.prediction='known';S.revealed=true;S.finished=false;save();render();$('#change-result').scrollIntoView({block:'center'});return;}
 if(a==='download-previous'&&previousWork){const text=[C.previousBriefSummary||'Earlier exercise: frequency of references and cost, before the paper-based correction.','Forecast: '+(previousWork.forecast||''),'Comparison: '+(previousWork.trade||''),'Change: '+(previousWork.change||'')].join('\n\n'),url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='Bardach_'+C.id+'_earlier_answers.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
 if(a==='next-project')return go(2);if(a==='next-compare')return go(3);
 if(a==='reveal'&&firstReady()&&S.prediction){S.revealed=true;save();render();$('#change-result').scrollIntoView({block:'center'});return;}
 if(a==='finish'&&completeReady()){S.finished=true;save();render();$('#result').scrollIntoView({block:'start'});return;}
 if(a==='copy'){
  const n=$('#learning-note');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(n.value);else{n.focus();n.select();if(!document.execCommand('copy'))throw Error('copy');}$('#copy-status').textContent='Copied.';}catch(e){n.focus();n.select();$('#copy-status').textContent='Copy was unavailable. The note is selected; use Ctrl+C or Download TXT.';}return;
 }
 if(a==='download'){const url=URL.createObjectURL(new Blob([note()],{type:'text/plain;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='Bardach_basic_'+C.id+'.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#copy-status').textContent='Download started.';return;}
 if(b.id==='reset'&&confirm('Restart this v3 exercise? Your three explanations in this version will be cleared.')){S=defaults();save();render();window.scrollTo(0,0);}
});
save();render();
</script></body></html>
